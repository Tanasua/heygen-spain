name: Check & Process New Videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dub_provider:
        description: "Провайдер дубляжу для цього ручного запуску"
        type: choice
        options: ["inworld", "heygen"]
        default: "inworld"
      max_videos:
        description: "Ліміт кількості нових відео за цей запуск (0 = без ліміту)"
        type: string
        default: "0"

permissions:
  contents: write
  actions: read

concurrency:
  group: check-and-process
  cancel-in-progress: false

jobs:
  # Cron спрацьовує кожні 30 хв (48 разів/добу), але реальну обробку
  # пускаємо не більше 5 разів на добу СУМАРНО на весь пайплайн —
  # рахуємо запуски і check_and_process.yml, і publish.yml разом, будь-
  # якого статусу (success/failure/cancelled/in_progress), від початку
  # поточної доби (UTC).
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Порахувати запуски пайплайну за сьогодні (UTC) і застосувати ліміт 5/добу
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          total=0
          for wf in check_and_process.yml publish.yml; do
            count="$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${wf}/runs?created=%3E%3D${today}&per_page=100" \
              | jq '.total_count')"
            echo "Запусків ${wf} сьогодні: $count"
            total=$((total + count))
          done
          echo "Разом запусків пайплайну сьогодні (включно з цим): $total"
          if [ "$total" -gt 5 ]; then
            echo "Ліміт 5 запусків/добу на весь пайплайн вичерпано — пропускаю обробку до завтра (UTC)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  process:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (потрібен yt-dlp для merge відео/аудіо)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Deno (JS runtime для розв'язання YouTube n-challenge в yt-dlp)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run processing script
        working-directory: scripts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          # Резидентний/ISP-проксі для yt-dlp — без нього завантаження з
          # датацентр-IP GitHub Actions може впасти на "Sign in to confirm
          # you're not a bot" навіть зі свіжими cookies.
          YT_DLP_PROXY_URL: ${{ secrets.YT_DLP_PROXY_URL }}
          SOURCE_CHANNEL_HANDLE: "@GlavredTV"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # "inworld" (типово, дешево) або "heygen" (ліп-синк, ~$4/хв — лише
          # ручний фолбек через workflow_dispatch, за розкладом не вмикається).
          DUB_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.dub_provider || 'inworld' }}
          MAX_VIDEOS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_videos || '0' }}
          INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          # Потрібні для inworld-шляху: заливка на іспанський канал
          # відбувається одразу тут, а не у Workflow 2.
          YOUTUBE_ES_CLIENT_ID: ${{ secrets.YOUTUBE_ES_CLIENT_ID }}
          YOUTUBE_ES_CLIENT_SECRET: ${{ secrets.YOUTUBE_ES_CLIENT_SECRET }}
          YOUTUBE_ES_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ES_REFRESH_TOKEN }}
          # 0 = вимкнено. Постав 1080, щоб зменшувати файл перед передачею (тільки heygen-шлях).
          TRANSCODE_MAX_HEIGHT: "0"
          FETCH_TIMEOUT_SECONDS: "2700"
        run: python process_new_video.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/thumbnails
          touch data/thumbnails/.gitkeep
          git add data/processed.json data/thumbnails
          git diff --cached --quiet && echo "Змін немає" && exit 0
          git commit -m "chore: update processed.json [skip ci]"
          # Два workflow комітять у ті самі файли — можливий race при push.
          # Кілька спроб з rebase на випадок, якщо інший job уже запушив.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push не вдався (спроба $i), роблю rebase..."
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            sleep $((i * 5))
          done
          echo "Не вдалось запушити стан після 5 спроб" >&2
          exit 1
