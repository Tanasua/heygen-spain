name: Check & Process New Videos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dub_provider:
        description: "Провайдер дубляжу для цього ручного запуску"
        type: choice
        options: ["inworld", "heygen"]
        default: "inworld"
      max_videos:
        description: "Ліміт кількості нових відео за цей запуск (0 = без ліміту)"
        type: string
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: check-and-process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (потрібен yt-dlp для merge відео/аудіо)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Deno (JS runtime для розв'язання YouTube n-challenge в yt-dlp)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run processing script
        working-directory: scripts
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Основний шлях завантаження — Apify actor (не залежить від cookies
          # чи датацентр-IP GitHub Actions). Якщо не задано або впаде —
          # автоматичний фолбек на yt-dlp нижче.
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          # Резидентний/mobile проксі для yt-dlp — без нього завантаження з
          # датацентр-IP GitHub Actions може впасти на "Sign in to confirm
          # you're not a bot" навіть зі свіжими cookies. Формат:
          # http://user:pass@host:port. Див. README.
          YT_DLP_PROXY_URL: ${{ secrets.YT_DLP_PROXY_URL }}
          SOURCE_CHANNEL_HANDLE: "@GlavredTV"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # "inworld" (типово, дешевше, віддає пакет у Telegram одразу тут) або
          # "heygen" (ліп-синк, ~$4/хв — надто дорого, лише ручний фолбек).
          # За розкладом (cron) завжди "inworld"; "heygen" можна обрати лише
          # вручну через workflow_dispatch (кнопка Run workflow).
          DUB_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.dub_provider || 'inworld' }}
          MAX_VIDEOS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.max_videos || '0' }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
          # 0 = вимкнено. Постав 1080, щоб зменшувати файл перед передачею (тільки heygen-шлях).
          TRANSCODE_MAX_HEIGHT: "0"
          FETCH_TIMEOUT_SECONDS: "2700"
        run: python process_new_video.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/thumbnails
          touch data/thumbnails/.gitkeep
          git add data/processed.json data/thumbnails
          git diff --cached --quiet && echo "Змін немає" && exit 0
          git commit -m "chore: update processed.json [skip ci]"
          # Два workflow комітять у ті самі файли — можливий race при push.
          # Кілька спроб з rebase на випадок, якщо інший job уже запушив.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push не вдався (спроба $i), роблю rebase..."
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            sleep $((i * 5))
          done
          echo "Не вдалось запушити стан після 5 спроб" >&2
          exit 1

      # Скрипт тепер завершується з ненульовим кодом при реальній помилці
      # (mark_failed), тож цей крок спрацює лише якщо щось справді впало.
      # Вимикаємо розклад (schedule), щоб той самий баг не повторювався
      # мовчки кожні 30 хв — увімкнути назад вручну: Actions -> цей workflow
      # -> "..." -> Enable workflow.
      - name: Disable schedule after failure (circuit breaker)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/actions/workflows/check_and_process.yml/disable"
          echo "::warning::Розклад check_and_process.yml вимкнено через помилку. Увімкніть вручну після виправлення."
