name: Publish Translated Videos

on:
  # Schedule вимкнено: DUB_PROVIDER=inworld (типовий, дешевий шлях) віддає
  # готовий пакет у Telegram синхронно прямо в check_and_process.yml, тож
  # цьому workflow (опрацювання чергу HeyGen-job'ів) за розкладом уже
  # нема чого робити щоразу — навіщо витрачати спільний ліміт 5/добу на
  # холості прогони. Лишається доступний вручну — знадобиться, якщо
  # колись свідомо запустити ручний HeyGen-фолбек (workflow_dispatch,
  # dub_provider=heygen, у check_and_process.yml).
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Той самий спільний ліміт, що й у check_and_process.yml: не більше 5
  # запусків на добу СУМАРНО на обидва workflow разом, незалежно від
  # успіху/невдачі.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Порахувати запуски пайплайну за сьогодні (UTC) і застосувати ліміт 5/добу
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          total=0
          for wf in check_and_process.yml publish.yml; do
            count="$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${wf}/runs?created=%3E%3D${today}&per_page=100" \
              | jq '.total_count')"
            echo "Запусків ${wf} сьогодні: $count"
            total=$((total + count))
          done
          echo "Разом запусків пайплайну сьогодні (включно з цим): $total"
          if [ "$total" -gt 5 ]; then
            echo "Ліміт 5 запусків/добу на весь пайплайн вичерпано — пропускаю публікацію до завтра (UTC)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (потрібен для перекодування відео під ліміт Telegram)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publish script
        working-directory: scripts
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publish_pending.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/thumbnails
          touch data/thumbnails/.gitkeep
          git add -A data/processed.json data/thumbnails
          git diff --cached --quiet && echo "Змін немає" && exit 0
          git commit -m "chore: update processed.json after publish [skip ci]"
          # Два workflow комітять у ті самі файли — можливий race при push.
          # Кілька спроб з rebase на випадок, якщо інший job уже запушив.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push не вдався (спроба $i), роблю rebase..."
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            sleep $((i * 5))
          done
          echo "Не вдалось запушити стан після 5 спроб" >&2
          exit 1
