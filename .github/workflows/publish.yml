name: Publish Translated Videos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Аналогічно check_and_process.yml: cron стукає кожні 15 хв, але реальну
  # публікацію пускаємо не більше 5 разів на добу, незалежно від успіху/
  # невдачі попередніх запусків.
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Порахувати запуски за сьогодні (UTC) і застосувати ліміт 5/добу
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          count="$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish.yml/runs?created=%3E%3D${today}&per_page=100" \
            | jq '.total_count')"
          echo "Запусків publish.yml сьогодні (включно з цим): $count"
          if [ "$count" -gt 5 ]; then
            echo "Ліміт 5 запусків/добу вичерпано — пропускаю публікацію до завтра (UTC)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publish script
        working-directory: scripts
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_ES_CLIENT_ID: ${{ secrets.YOUTUBE_ES_CLIENT_ID }}
          YOUTUBE_ES_CLIENT_SECRET: ${{ secrets.YOUTUBE_ES_CLIENT_SECRET }}
          YOUTUBE_ES_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ES_REFRESH_TOKEN }}
        run: python publish_pending.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/thumbnails
          touch data/thumbnails/.gitkeep
          git add -A data/processed.json data/thumbnails
          git diff --cached --quiet && echo "Змін немає" && exit 0
          git commit -m "chore: update processed.json after publish [skip ci]"
          # Два workflow комітять у ті самі файли — можливий race при push.
          # Кілька спроб з rebase на випадок, якщо інший job уже запушив.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push не вдався (спроба $i), роблю rebase..."
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            sleep $((i * 5))
          done
          echo "Не вдалось запушити стан після 5 спроб" >&2
          exit 1
